<title>Garde-manger — prototype</title>
<style>
  :root {
    --radius: 14px;
    --radius-s: 10px;
    --bg: #FFFFFF;
    --surface: #F7F6F2;
    --ink: #26302A;
    --muted: #71806F;
    --accent: #C73E36;
    --accent-ink: #FFF6F4;
    --warn: #C97B12;
    --warn-bg: #F7E8D2;
    --line: #E6E4DC;
    --loc-cuisine: #C73E36;
    --loc-chauffage: #E8842C;
    --loc-reserve: #3D8B4F;
    --loc-autre: #7B4B94;
    --loc-vegan: #2E6F8E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181A;
      --surface: #1F2528;
      --ink: #ECEEE8;
      --muted: #93A096;
      --accent: #E4635A;
      --accent-ink: #2A0F0C;
      --warn: #E8A33B;
      --warn-bg: #33270F;
      --line: #2E3639;
      --loc-cuisine: #E4635A;
      --loc-chauffage: #F2A052;
      --loc-reserve: #6FBE8C;
      --loc-autre: #B48BC9;
      --loc-vegan: #6FAECB;
    }
  }
  :root[data-theme="light"] {
    --bg: #FFFFFF;
    --surface: #F7F6F2;
    --ink: #26302A;
    --muted: #71806F;
    --accent: #C73E36;
    --accent-ink: #FFF6F4;
    --warn: #C97B12;
    --warn-bg: #F7E8D2;
    --line: #E6E4DC;
    --loc-cuisine: #C73E36;
    --loc-chauffage: #E8842C;
    --loc-reserve: #3D8B4F;
    --loc-autre: #7B4B94;
    --loc-vegan: #2E6F8E;
  }
  :root[data-theme="dark"] {
    --bg: #14181A;
    --surface: #1F2528;
    --ink: #ECEEE8;
    --muted: #93A096;
    --accent: #E4635A;
    --accent-ink: #2A0F0C;
    --warn: #E8A33B;
    --warn-bg: #33270F;
    --line: #2E3639;
    --loc-cuisine: #E4635A;
    --loc-chauffage: #F2A052;
    --loc-reserve: #6FBE8C;
    --loc-autre: #B48BC9;
    --loc-vegan: #6FAECB;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 0 16px 150px; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 640px; margin: 0 auto; padding: 12px 16px 10px;
    display: flex; flex-direction: column; gap: 10px;
  }
  h1 {
    margin: 0;
    font-size: 1.3rem; font-weight: 700; letter-spacing: 0.01em;
  }
  h1 small { font-family: inherit; font-weight: 400; color: var(--muted); font-size: 0.75em; }

  .tabs { display: flex; gap: 6px; }
  .tabs button {
    flex: 1; padding: 7px 12px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--muted);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tabs button .count {
    display: inline-block; min-width: 1.4em; margin-left: 6px; padding: 0 4px;
    border-radius: 999px; background: var(--warn); color: #fff;
    font-size: 0.75rem; line-height: 1.4;
  }

  .filters { display: flex; flex-direction: column; gap: 8px; padding: 12px 0 4px; }
  #search {
    width: 100%; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--ink); font: inherit;
  }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px; }
  .chips button {
    flex: 0 0 auto; padding: 4px 11px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    font: inherit; font-size: 0.83rem; cursor: pointer; white-space: nowrap;
  }
  .chips button.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .group-title {
    margin: 18px 2px 4px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  .group-title .n { font-weight: 400; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 4px; border-bottom: 1px solid var(--line);
    min-height: 38px;
  }
  .row.low { box-shadow: inset 3px 0 0 var(--warn); padding-left: 9px; }
  .row .name {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 0.95rem;
  }
  .row.low .name { color: var(--warn); }
  .row.done .name { text-decoration: line-through; color: var(--muted); }
  .row .note { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

  .qty { display: flex; align-items: center; }
  .qty output {
    min-width: 1.8em; text-align: center; font-weight: 700;
    font-variant-numeric: tabular-nums; font-size: 0.95rem;
  }
  .row.low .qty output { color: var(--warn); }
  .qty button, .icon-btn {
    width: 30px; height: 30px; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: var(--radius-s);
    background: var(--surface); color: var(--ink);
    font: inherit; cursor: pointer; padding: 0;
  }
  .qty button:active, .icon-btn:active { background: var(--line); }
  .icon-btn.danger { color: var(--muted); border-color: transparent; background: none; }
  .icon-btn.cart-on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .icon-btn svg, .qty button svg { width: 15px; height: 15px; }

  .row input[type="checkbox"] { width: 19px; height: 19px; accent-color: var(--accent); flex: 0 0 auto; margin: 0; }

  .empty { padding: 32px 8px; text-align: center; color: var(--muted); }

  .addbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .addbar form { max-width: 608px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 6px; }
  .addbar input, .addbar select {
    padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg); color: var(--ink); font: inherit; min-width: 0;
  }
  #add-name { flex: 2 1 140px; }
  #add-loc, #add-store, #shop-store { flex: 1 1 100px; }
  #add-qty { flex: 0 1 64px; }
  #shop-name { flex: 2 1 140px; }
  .addbar .submit {
    padding: 9px 16px; border: none; border-radius: var(--radius);
    background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 700; cursor: pointer;
  }
  .mic {
    width: 42px; padding: 0; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg); color: var(--accent); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .mic.listening { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
  .mic svg { width: 18px; height: 18px; }
  .hint { width: 100%; margin: 2px 0 0; font-size: 0.78rem; color: var(--muted); }

  .toolbar { display: flex; justify-content: flex-end; margin-top: 16px; }
  .toolbar button {
    padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--accent);
    font: inherit; font-weight: 600; cursor: pointer;
  }

  :is(button, input, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .tabs button, .chips button { transition: background 0.15s, color 0.15s, border-color 0.15s; }
  }
</style>

<header>
  <div class="header-inner">
    <h1>Garde-manger <small>prototype</small></h1>
    <nav class="tabs">
      <button id="tab-stock" class="active" type="button">Stock</button>
      <button id="tab-shop" type="button">Courses<span class="count" id="shop-count" hidden></span></button>
    </nav>
  </div>
</header>

<main>
  <section id="view-stock">
    <div class="filters">
      <input id="search" type="search" placeholder="Rechercher une épice, un ingrédient…" aria-label="Rechercher">
      <div class="chips" id="loc-chips"></div>
    </div>
    <div id="stock-list"></div>
  </section>

  <section id="view-shop" hidden>
    <div id="shop-list"></div>
    <div class="toolbar">
      <button id="btn-clear-done" type="button">Ranger les achats</button>
    </div>
  </section>
</main>

<div class="addbar">
  <form id="form-stock" autocomplete="off">
    <input id="add-name" placeholder="Ingrédient" required>
    <input id="add-qty" type="number" inputmode="numeric" min="0" value="1" aria-label="Nombre de pots" title="Nombre de pots">
    <input id="add-loc" list="locs" placeholder="Emplacement">
    <input id="add-store" list="stores" placeholder="Où acheter">
    <button class="mic" id="btn-mic" type="button" aria-label="Saisie vocale">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="9" y="3" width="6" height="11" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path>
      </svg>
    </button>
    <button class="submit" type="submit">Ajouter</button>
    <p class="hint" id="voice-hint">Micro : dites par exemple « deux garam masala » ou « curcuma ». La dictée du clavier iPhone marche aussi dans chaque champ.</p>
  </form>
  <form id="form-shop" autocomplete="off" hidden>
    <input id="shop-name" placeholder="Produit à acheter" required>
    <input id="shop-store" list="stores" placeholder="Où acheter">
    <button class="submit" type="submit">Ajouter</button>
  </form>
</div>

<datalist id="locs"></datalist>
<datalist id="stores"></datalist>

<script>
  const KEY = "garde-manger-poc-v2";
  const LOCS = ["Cuisine", "Sous chauffage", "Réserve entrée", "Autre", "Vegan",
    "Placard", "Frigo", "Congélateur 1", "Congélateur 2", "Cave"];
  const STORES = ["Leclerc", "Grand Frais", "Marché", "Boutique spécialisée", "Internet"];
  const LOC_COLORS = {
    "Cuisine": "--loc-cuisine",
    "Sous chauffage": "--loc-chauffage",
    "Réserve entrée": "--loc-reserve",
    "Autre": "--loc-autre",
    "Vegan": "--loc-vegan"
  };

  // Inventaire du 06/07/2026. Une ligne = un produit, ";n" = nombre de pots (1 par défaut, 0 = à racheter).
  const SEED_LINES = {
    "Cuisine": `Baie de genièvre
Quatre épices
Piment de Cayenne
Ras el hanout jaune
Poivre de Sichuan;0
Piment d'Espelette
Garam masala
Romarin
Basilic
Bouquet garni
Cerfeuil
Aneth
Ciboulette
Estragon
Persil
Origan
Persillade
Cumin en graines
Ail semoule
Muscade moulue
Noix de muscade
Anis vert
Cardamome moulue
Cumin moulu
Curcuma
Curry vert thaï
Épices marocaines
Chili en poudre
Mélange thaï pour wok
Curry rouge piquant
Coriandre en graines
Vadouvan masala maison
Marinade curry
Gingembre moulu
Safran
Clou de girofle
Baies roses
Bois d'Inde moulu
Mélange italien;2
Thym
Herbes de Provence
Moulin saveur grillades
Noisettes concassées
Moulin poivre blanc
Moulin 5 baies
Bois d'Inde entier
Pimentón
Ail frit
Macis de noix de muscade`,
    "Sous chauffage": `Cannelle en bâtons
Piment de Cayenne entier
Coriandre en poudre
Paprika doux
Curry indien
Épices couscous;0
Ñora pepper;0
Cannelle moulue
Épices à paella
Carvi noir entier
Poivre noir entier
Rouille
Safran
Poivre de Madagascar
Poivre de Malabar;0
Poivre de Tellicherry
Poivre long de Java
Cardamome noire entière
Épices kefta
Épices Colombo;0
Pimentón;0
Anis étoilé (badiane)
Asafoetida;0
Muscade moulue
Coriandre moulue
Cumin moulu
Clous de girofle moulus
Cardamome moulue
Clous de girofle
Ras el hanout`,
    "Réserve entrée": `Cardamome moulue
Persillade
Baies roses
Bouquet garni
Ciboulette
Estragon
Quatre épices;3
Romarin
Piment de Jamaïque
Poivre blanc en grains
Piment de Cayenne
Poivre vert;2
Coriandre entière
Coriandre moulue;2
Cardamome verte
Anis en grains
Persil
Basilic
Curcuma moulu
Coriandre en grains
Piment oiseau entier
Garam masala;2
Curry Madras
Anis étoilé (badiane)
Carvi entier
Épices couscous
Ras el hanout jaune
Clous de girofle
Poivre de Sichuan
Piment fort en poudre
Cumin moulu;3
Cumin entier
Fenouil entier
Ras el hanout rouge
Muscade moulue
Curry doux
Noix de muscade
Noix de muscade moulue
Piment d'Espelette
Paprika fumé au bois de chêne
Herbes de Provence
Poivre noir`,
    "Autre": `Feuille de citron kaffir
Ajowan en graines
Feuille de curry (kaloupilé)
Cardamome noire
Citronnelle
Fenugrec
Poivre de Sichuan vert
Graines de sésame doré
Graines de sésame noir
Poivre de Madagascar
Safran en pistils
Poivre de Szechwan
Poivre de Sichuan noir
Graines de chia noir
Poudre de mangue séchée
Spiruline`,
    "Vegan": `Huile de coco
Flocons d'avoine
Noix de cajou`
  };

  function buildSeed() {
    const items = [];
    let id = 1;
    for (const [loc, lines] of Object.entries(SEED_LINES)) {
      for (const line of lines.split("\n")) {
        const [name, qty] = line.split(";");
        items.push({ id: id++, name: name.trim(), loc, qty: qty === undefined ? 1 : Number(qty), min: 0, store: "" });
      }
    }
    return { items, shop: [], nextId: id + 500 };
  }

  let db = load();
  function load() {
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : buildSeed();
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(db)); }

  let currentTab = "stock";
  let currentLoc = "Tous";
  let query = "";

  function fold(s) {
    return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  function syncShop() {
    for (const it of db.items) {
      const entry = db.shop.find(s => s.itemId === it.id);
      if (it.qty <= it.min && !entry) {
        db.shop.push({ id: db.nextId++, name: it.name, store: it.store || "", done: false, itemId: it.id });
      } else if (it.qty > it.min && entry && !entry.done && !entry.manual) {
        db.shop = db.shop.filter(s => s !== entry);
      }
    }
  }

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
    }
    node.append(...children);
    return node;
  }

  function iconSvg(path) {
    const span = document.createElement("span");
    span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' + path + "</svg>";
    span.style.display = "contents";
    return span;
  }
  const MINUS = "<path d='M5 12h14'/>";
  const PLUS = "<path d='M12 5v14M5 12h14'/>";
  const TRASH = "<path d='M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3'/>";
  const CART = "<circle cx='9' cy='20' r='1'/><circle cx='18' cy='20' r='1'/><path d='M3 4h2l2.4 12.2a1 1 0 0 0 1 .8h9.8a1 1 0 0 0 1-.8L21 8H6'/>";

  function renderChips() {
    const box = document.getElementById("loc-chips");
    box.replaceChildren();
    const locs = ["Tous", ...new Set([...Object.keys(SEED_LINES), ...db.items.map(i => i.loc).filter(Boolean)])];
    for (const loc of locs) {
      const active = loc === currentLoc;
      const btn = el("button", {
        type: "button",
        class: active ? "active" : "",
        onclick: () => { currentLoc = loc; render(); }
      }, loc);
      const colorVar = LOC_COLORS[loc];
      if (colorVar) {
        btn.style.color = "var(" + colorVar + ")";
        btn.style.borderColor = "var(" + colorVar + ")";
        if (active) btn.style.background = "color-mix(in srgb, var(" + colorVar + ") 14%, transparent)";
      }
      box.append(btn);
    }
  }

  function renderStock() {
    const box = document.getElementById("stock-list");
    box.replaceChildren();
    let items = db.items.filter(i => currentLoc === "Tous" || i.loc === currentLoc);
    if (query) items = items.filter(i => fold(i.name).includes(fold(query)));
    if (!items.length) {
      box.append(el("p", { class: "empty" }, query ? "Aucun résultat pour « " + query + " »." : "Aucun ingrédient ici. Ajoutez-en un ci-dessous, au clavier ou au micro."));
      return;
    }
    const byLoc = Map.groupBy(items, i => i.loc || "Sans emplacement");
    for (const [loc, group] of byLoc) {
      box.append(el("p", { class: "group-title" }, loc + " ", el("span", { class: "n" }, "· " + group.length)));
      const list = el("ul");
      for (const it of group) {
        const low = it.qty <= it.min;
        const ordered = db.shop.some(s => s.itemId === it.id);
        list.append(el("li", { class: "row" + (low ? " low" : "") },
          el("span", { class: "name", title: it.name }, it.name),
          el("button", { class: "icon-btn" + (ordered ? " cart-on" : ""), type: "button",
            "aria-label": "Commander", title: ordered ? "Déjà en liste de courses" : "Mettre en liste de courses",
            onclick: () => toggleOrder(it) }, iconSvg(CART)),
          el("div", { class: "qty" },
            el("button", { type: "button", "aria-label": "Un pot de moins", onclick: () => changeQty(it, -1) }, iconSvg(MINUS)),
            el("output", { title: "pots" }, String(it.qty)),
            el("button", { type: "button", "aria-label": "Un pot de plus", onclick: () => changeQty(it, 1) }, iconSvg(PLUS))
          ),
          el("button", { class: "icon-btn danger", type: "button", "aria-label": "Supprimer", onclick: () => removeItem(it) }, iconSvg(TRASH))
        ));
      }
      box.append(list);
    }
  }

  function renderShop() {
    const box = document.getElementById("shop-list");
    box.replaceChildren();
    if (!db.shop.length) {
      box.append(el("p", { class: "empty" }, "Liste de courses vide. Les ingrédients à 0 pot s'ajoutent ici automatiquement."));
      return;
    }
    const byStore = Map.groupBy(db.shop, s => s.store || "Autre");
    for (const [store, group] of byStore) {
      box.append(el("p", { class: "group-title" }, store + " ", el("span", { class: "n" }, "· " + group.length)));
      const list = el("ul");
      for (const entry of group) {
        list.append(el("li", { class: "row" + (entry.done ? " done" : "") },
          el("input", { type: "checkbox", checked: entry.done, "aria-label": "Acheté",
            onchange: e => { entry.done = e.target.checked; save(); render(); } }),
          el("span", { class: "name", title: entry.name }, entry.name),
          el("span", { class: "note" }, entry.itemId ? (entry.manual ? "réserve" : "auto") : ""),
          el("button", { class: "icon-btn danger", type: "button", "aria-label": "Supprimer",
            onclick: () => { db.shop = db.shop.filter(s => s !== entry); save(); render(); } }, iconSvg(TRASH))
        ));
      }
      box.append(list);
    }
  }

  function render() {
    syncShop();
    save();
    renderChips();
    renderStock();
    renderShop();
    const n = db.shop.filter(s => !s.done).length;
    const count = document.getElementById("shop-count");
    count.hidden = n === 0;
    count.textContent = n;
    document.getElementById("view-stock").hidden = currentTab !== "stock";
    document.getElementById("view-shop").hidden = currentTab !== "shop";
    document.getElementById("form-stock").hidden = currentTab !== "stock";
    document.getElementById("form-shop").hidden = currentTab !== "shop";
    document.getElementById("tab-stock").className = currentTab === "stock" ? "active" : "";
    document.getElementById("tab-shop").className = currentTab === "shop" ? "active" : "";
  }

  function changeQty(item, delta) {
    item.qty = Math.max(0, item.qty + delta);
    render();
  }
  function toggleOrder(item) {
    const entry = db.shop.find(s => s.itemId === item.id);
    if (!entry) {
      db.shop.push({ id: db.nextId++, name: item.name, store: item.store || "", done: false, itemId: item.id, manual: true });
    } else if (entry.manual && !entry.done) {
      db.shop = db.shop.filter(s => s !== entry);
    }
    render();
  }
  function removeItem(item) {
    db.items = db.items.filter(i => i !== item);
    db.shop = db.shop.filter(s => s.itemId !== item.id);
    render();
  }

  document.getElementById("tab-stock").onclick = () => { currentTab = "stock"; render(); };
  document.getElementById("tab-shop").onclick = () => { currentTab = "shop"; render(); };
  document.getElementById("search").oninput = e => { query = e.target.value; renderStock(); };

  document.getElementById("form-stock").onsubmit = e => {
    e.preventDefault();
    db.items.push({
      id: db.nextId++,
      name: document.getElementById("add-name").value.trim(),
      qty: Number(document.getElementById("add-qty").value) || 0,
      min: 0,
      loc: document.getElementById("add-loc").value.trim() || (currentLoc !== "Tous" ? currentLoc : ""),
      store: document.getElementById("add-store").value.trim()
    });
    e.target.reset();
    document.getElementById("add-qty").value = 1;
    render();
  };

  document.getElementById("form-shop").onsubmit = e => {
    e.preventDefault();
    db.shop.push({
      id: db.nextId++,
      name: document.getElementById("shop-name").value.trim(),
      store: document.getElementById("shop-store").value.trim(),
      done: false
    });
    e.target.reset();
    render();
  };

  document.getElementById("btn-clear-done").onclick = () => {
    for (const entry of db.shop.filter(s => s.done)) {
      const item = db.items.find(i => i.id === entry.itemId);
      if (item) item.qty += 1;
    }
    db.shop = db.shop.filter(s => !s.done);
    render();
  };

  const NUMBER_WORDS = { un: 1, une: 1, deux: 2, trois: 3, quatre: 4, cinq: 5, six: 6, sept: 7, huit: 8, neuf: 9, dix: 10 };
  function parseVoice(text) {
    let words = text.trim().toLowerCase().replace(/^ajoute[rz]?\s+/, "").split(/\s+/);
    let qty = 1;
    const first = words[0];
    if (/^\d+$/.test(first)) { qty = Number(first); words = words.slice(1); }
    else if (NUMBER_WORDS[first]) { qty = NUMBER_WORDS[first]; words = words.slice(1); }
    return { qty, name: words.join(" ") };
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById("btn-mic");
  const hint = document.getElementById("voice-hint");
  if (SR) {
    const rec = new SR();
    rec.lang = "fr-FR";
    rec.interimResults = false;
    let listening = false;
    micBtn.onclick = () => {
      if (listening) { rec.stop(); return; }
      rec.start();
    };
    rec.onstart = () => { listening = true; micBtn.classList.add("listening"); hint.textContent = "Je vous écoute…"; };
    rec.onend = () => { listening = false; micBtn.classList.remove("listening"); };
    rec.onerror = ev => { hint.textContent = "Micro indisponible (" + ev.error + "). Utilisez la dictée du clavier."; };
    rec.onresult = ev => {
      const text = ev.results[0][0].transcript;
      const { qty, name } = parseVoice(text);
      document.getElementById("add-name").value = name.charAt(0).toUpperCase() + name.slice(1);
      document.getElementById("add-qty").value = qty;
      hint.textContent = "Entendu : « " + text + " ». Vérifiez puis touchez Ajouter.";
    };
  } else {
    micBtn.hidden = true;
    hint.textContent = "Reconnaissance vocale non disponible dans ce navigateur : utilisez la dictée du clavier dans les champs.";
  }

  const locList = document.getElementById("locs");
  const storeList = document.getElementById("stores");
  for (const l of LOCS) locList.append(el("option", { value: l }));
  for (const s of STORES) storeList.append(el("option", { value: s }));

  render();
</script>
